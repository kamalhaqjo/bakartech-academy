<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Bakartech YouTube cover - level 3, lesson 11</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* 1920x1080 landscape (16:9) YouTube cover. Never put dir="rtl" on <html>: direction is set per container. */
html,body{margin:0;padding:0;background:#000}
#cover{position:relative;width:1920px;height:1080px;overflow:hidden;color:#fff;font-family:'Vazir','Lalezar',sans-serif;
  background:linear-gradient(120deg,#04060c 0%,#08101f 48%,#120c07 100%)}
#cover *{box-sizing:border-box}
.abs{position:absolute}
.rtl{direction:rtl;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate}

/* depth: warm glows, a calm candlestick chart receding into the distance, soft vignette */
#glow{position:absolute;inset:0;background:
  radial-gradient(760px 560px at 27% 52%,rgba(245,185,66,.18),rgba(245,185,66,0) 70%),
  radial-gradient(700px 480px at 22% 24%,rgba(70,214,255,.16),rgba(70,214,255,0) 70%),
  radial-gradient(640px 460px at 90% 8%,rgba(255,138,31,.13),rgba(255,138,31,0) 70%),
  radial-gradient(900px 500px at 60% 105%,rgba(255,138,31,.10),rgba(255,138,31,0) 70%)}
.chartwrap{position:absolute;pointer-events:none}
#far{left:-300px;top:120px;width:2500px;height:1000px;opacity:.34;filter:blur(10px);transform:perspective(1500px) rotateY(-22deg) rotateX(8deg) scale(1.2);transform-origin:60% 60%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 28%,#000 80%,transparent 100%)}
#mid{left:-90px;top:300px;width:2150px;height:760px;opacity:.88;filter:blur(1.1px);transform:perspective(1500px) rotateY(-16deg) rotateX(10deg);transform-origin:62% 100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0%,#000 30%,#000 82%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.chartwrap svg{display:block;width:100%;height:100%}
/* scrim keeps the headline readable even at thumbnail size */
#scrim{position:absolute;inset:0;background:
  radial-gradient(900px 560px at 76% 36%,rgba(4,6,12,.62),rgba(4,6,12,0) 72%),
  linear-gradient(180deg,rgba(4,6,12,.60) 0%,rgba(4,6,12,0) 20%,rgba(4,6,12,0) 74%,rgba(4,6,12,.55) 100%)}
#subscrim{position:absolute;left:760px;top:672px;width:1160px;height:170px;background:radial-gradient(ellipse at 66% 50%,rgba(4,6,12,.86) 0%,rgba(4,6,12,.66) 52%,rgba(4,6,12,0) 100%)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 56%,rgba(0,0,0,.48) 100%)}

/* symbols: price bouncing between a green support zone and a red resistance zone (same colours as the video) */
#icons{position:absolute;left:46px;top:236px;width:860px;height:640px;transform:scale(.86);transform-origin:0 0}
#icons svg{position:absolute;inset:0;overflow:visible}

/* the owner's logo (top-left), same file as in the video */
#logo{position:absolute;left:52px;top:36px;height:176px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}

/* corner badge (top-right) */
#badge{position:absolute;right:70px;top:50px;height:84px;padding:0 44px;border-radius:24px;display:flex;align-items:center;justify-content:center;direction:rtl;
  font-family:'Vazir';font-weight:900;font-size:56px;color:#1b1203;white-space:nowrap;
  background:linear-gradient(115deg,#ffe48a 0%,#f7bd3c 52%,#ff8a1f 130%);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 44px rgba(255,170,40,.32),inset 0 2px 0 rgba(255,255,255,.55)}

/* headline */
#title{position:absolute;right:70px;top:150px;width:1000px;direction:rtl;text-align:right}
#t1,#t2{display:block;font-family:'Lalezar';font-weight:400;white-space:nowrap;line-height:1.02}
#t1{font-size:216px;color:#f8f3e8;filter:drop-shadow(0 7px 0 rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(0,0,0,.45))}
#t2{font-size:308px;margin-top:-6px;filter:drop-shadow(0 8px 0 rgba(60,24,0,.7)) drop-shadow(0 0 46px rgba(255,70,40,.42))}
#t2 span{background:linear-gradient(180deg,#ffd0c4 0%,#ff6a4a 45%,#d4260e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#accent{position:absolute;right:70px;top:690px;width:230px;height:9px;border-radius:5px;background:linear-gradient(270deg,#ffdf8a,#f5b942 55%,#ff8a1f)}
#sub{position:absolute;right:70px;top:712px;width:1000px;direction:rtl;text-align:right;white-space:nowrap;font-family:'Vazir';font-weight:700;font-size:64px;line-height:1.3;color:rgba(255,255,255,.92);
  text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 24px rgba(0,0,0,.5)}
#sub em{font-style:normal;font-weight:900;color:#ffd98a}

/* brand circle (photo) bottom-left */
#brand{position:absolute;left:70px;top:752px;width:258px;height:258px}
#brand svg.ring{position:absolute;inset:0;overflow:visible}
#avatar{position:absolute;left:19px;top:19px;width:220px;height:220px;border-radius:50%;overflow:hidden;background:#121826}
#avatar img{width:100%;height:100%;object-fit:cover;display:block}
#avatar svg{width:100%;height:100%;display:block}

/* footer line */
#foot{position:absolute;left:360px;right:70px;top:836px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;direction:rtl;
  font-family:'Vazir';font-weight:700;font-size:50px;color:#fff;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.26);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
#foot .sep{color:rgba(255,255,255,.45);margin:0 22px;font-weight:400}
#foot .bk{font-family:'Vazir';font-weight:900;font-size:54px;letter-spacing:.01em;background:linear-gradient(180deg,#ffe48a,#ffb42b 60%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent}

/* chips on the art (same glass notes as in the video) */
.chip{position:absolute;direction:rtl;unicode-bidi:isolate;white-space:nowrap;font-family:'Vazir';font-weight:900;font-size:40px;line-height:1;padding:12px 24px 13px;border-radius:16px;
  background:rgba(19,23,34,.82);border:2px solid rgba(255,255,255,.2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.14),0 10px 26px rgba(0,0,0,.45)}
#sub .g{color:#4CC3B5} #sub .r{color:#FF7B78} #sub .y{color:#F6C35B}
</style>
</head>
<body>
<div id="cover">
  <div id="glow"></div>
  <div id="far" class="chartwrap"><svg id="chartA" viewBox="0 0 2400 1000" preserveAspectRatio="none"></svg></div>
  <div id="mid" class="chartwrap"><svg id="chartB" viewBox="0 0 2400 1000" preserveAspectRatio="none"></svg></div>
  <div id="scrim"></div>
  <div id="subscrim"></div>
  <div id="vignette"></div>

  <div id="icons"><svg id="art" viewBox="0 0 860 640" width="860" height="640"></svg></div>

  <img id="logo" data-check="wm" src="assets/kamal_logo.png" alt="">
  <div id="badge" data-check="text">سطح ۳ · درس ۱۱</div>

  <div id="title" class="rtl">
    <span id="t1" data-check="text">ضرر خوب</span>
    <span id="t2" data-check="text"><span>ضرر بد</span></span>
  </div>
  <i id="accent"></i>
  <div id="sub" data-check="text"><b class="r">۶ اشتباه</b> در یک معامله</div>
  
  <div id="brand" data-check="brand">
    <svg class="ring" viewBox="0 0 258 258" width="258" height="258">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe48a"/><stop offset=".55" stop-color="#ffc21f"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
        <filter id="rglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter></defs>
      <circle cx="129" cy="129" r="122" fill="none" stroke="rgba(255,170,40,.5)" stroke-width="14" filter="url(#rglow)"/>
      <circle cx="129" cy="129" r="122" fill="none" stroke="url(#rg)" stroke-width="9"/>
    </svg>
    <div id="avatar"><img id="photo" alt="" style="display:none"><svg id="ph" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121826"/><circle cx="50" cy="38" r="16" fill="#3d3620"/><path d="M18 92c2-22 16-33 32-33s30 11 32 33z" fill="#3d3620"/></svg></div>
  </div>

  <div id="foot" data-check="text"><span>سطح ۳ · آموزش ترید حرفه‌ای</span><span class="sep ltr">|</span><span class="bk ltr">Bakartech</span></div>
</div>

<script>
(function () {
  /* ---- deterministic, calm candlestick chart (seeded; decorative, not market data) ---- */
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(20261103);
  const N = 74, cs = []; let p = 100, vol = 1;
  for (let i = 0; i < N; i++) {
    vol = 0.86 * vol + 0.14 * (0.55 + rnd() * 1.25);
    const drift = 0.22 + 0.4 * Math.sin(i / 7.5 + 0.8);               // a calm uptrend
    const o = p, c = p + drift + (rnd() - 0.5) * 2.0 * vol;
    const h = Math.max(o, c) + rnd() * 0.9 * vol, l = Math.min(o, c) - rnd() * 0.9 * vol;
    cs.push({ o, c, h, l, v: 0.35 + Math.abs(c - o) * 0.5 + rnd() * 0.5 }); p = c;
  }
  const lo = Math.min(...cs.map(x => x.l)), hi = Math.max(...cs.map(x => x.h));
  const W = 2400, H = 1000, top = 130, bot = 800, vtop = 840, vbot = 980, step = W / (N + 1);
  const Y = v => bot - (v - lo) / (hi - lo) * (bot - top), vmax = Math.max(...cs.map(x => x.v));
  const ma = cs.map((_, i) => { const s = cs.slice(Math.max(0, i - 19), i + 1); return s.reduce((a, b) => a + b.c, 0) / s.length; });
  function draw(svg) {
    let s = '';
    for (let g = 0; g <= 7; g++) { const y = top + g * (bot - top) / 7; s += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>`; }
    for (let g = 0; g <= 12; g++) { const x = g * W / 12; s += `<line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${vbot}" stroke="rgba(255,255,255,.04)" stroke-width="1.5"/>`; }
    cs.forEach((c, i) => {
      const x = (i + 1) * step, up = c.c >= c.o, col = up ? '#26A69A' : '#EF5350', yo = Y(c.o), yc = Y(c.c);
      s += `<line x1="${x.toFixed(1)}" y1="${Y(c.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(c.l).toFixed(1)}" stroke="${col}" stroke-width="3"/>`;
      s += `<rect x="${(x - step * 0.3).toFixed(1)}" y="${Math.min(yo, yc).toFixed(1)}" width="${(step * 0.6).toFixed(1)}" height="${Math.max(4, Math.abs(yo - yc)).toFixed(1)}" rx="2" fill="${col}"/>`;
      const vh = c.v / vmax * (vbot - vtop);
      s += `<rect x="${(x - step * 0.3).toFixed(1)}" y="${(vbot - vh).toFixed(1)}" width="${(step * 0.6).toFixed(1)}" height="${vh.toFixed(1)}" fill="${up ? 'rgba(38,166,154,.35)' : 'rgba(239,83,80,.35)'}"/>`;
    });
    const d = ma.map((v, i) => `${i ? 'L' : 'M'}${((i + 1) * step).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    s += `<path d="${d}" fill="none" stroke="#ffb42b" stroke-width="9" opacity=".35" stroke-linejoin="round" filter="url(#mablur)"/><path d="${d}" fill="none" stroke="#ffc547" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg.innerHTML = '<defs><filter id="mablur" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="8"/></filter></defs>' + s;
  }
  draw(document.getElementById('chartA')); draw(document.getElementById('chartB'));



  /* ---- the lesson's idea: two losses, the good one (by the plan, −1%) and the bad one (six mistakes, the stop dragged, −2.5%) ---- */
  (function drawArt() {
    const svg = document.getElementById('art'), G = '#26A69A', R = '#E63212', GOLD = '#D4AF37', INK = '#f8f3e8', MUTE = 'rgba(248,243,232,.6)';
    let s = '<defs><filter id="ag" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter></defs>';
    s += `<ellipse cx="230" cy="300" rx="260" ry="240" fill="rgba(230,50,18,.18)" filter="url(#ag)"/><ellipse cx="640" cy="300" rx="240" ry="220" fill="rgba(38,166,154,.14)" filter="url(#ag)"/>`;
    const card = (x, ok, head, v, foot) => {
      const c = ok ? G : R;
      let t = `<rect x="${x}" y="40" width="380" height="520" rx="28" fill="rgba(19,23,34,.94)" stroke="${c}" stroke-width="5"/>`;
      t += `<text x="${x + 350}" y="110" text-anchor="start" direction="rtl" font-family="Vazir" font-weight="900" font-size="40" fill="${INK}">${head}</text>`;
      t += `<text x="${x + 190}" y="300" text-anchor="middle" direction="ltr" unicode-bidi="isolate" font-family="Lalezar" font-size="${ok ? 150 : 132}" fill="${ok ? INK : R}">${v}</text>`;
      t += `<circle cx="${x + 190}" cy="410" r="52" fill="${c}"/>` + (ok ? `<path d="M ${x + 165} 410 L ${x + 184} 430 L ${x + 218} 392" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<path d="M ${x + 170} 390 L ${x + 210} 430 M ${x + 210} 390 L ${x + 170} 430" stroke="#fff" stroke-width="12" stroke-linecap="round"/>`);
      t += `<text x="${x + 190}" y="520" text-anchor="middle" direction="rtl" font-family="Vazir" font-weight="900" font-size="36" fill="${c}">${foot}</text>`;
      return t; };
    s += card(450, true, 'ضرر خوب', '−1%', 'طبق پلن') + card(30, false, 'ضرر بد', '−2.5%', '۶ اشتباه');
    s += `<path d="M 120 600 L 120 560" stroke="${GOLD}" stroke-width="0"/>`;
    svg.innerHTML = s;
    window.__placeChips = () => {};
  })();
  /* ---- optional brand photo: input/kamal.jpg (injected as window.PHOTO by tools/cover.mjs) ---- */
  if (window.PHOTO) { const im = document.getElementById('photo'); im.src = window.PHOTO; im.style.display = 'block'; document.getElementById('ph').style.display = 'none'; }

  /* ---- layout checks: fit the headline, keep everything inside the canvas, no overlaps ---- */
  function fit() {
    const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
    const maxW = 880; [[t1, 216], [t2, 308]].forEach(([e, fs]) => { e.style.fontSize = fs + 'px'; const rg = document.createRange(); rg.selectNodeContents(e); const w = rg.getBoundingClientRect().width; if (w > maxW) e.style.fontSize = (fs * maxW / w).toFixed(1) + 'px'; });   // measures the text, not the block
  }
  window.COVER = { ready: document.fonts.ready.then(() => { fit(); window.__placeChips(); return document.fonts.ready; }),
    checks() {
      const out = [], els = [...document.querySelectorAll('[data-check]')];
      const R = els.map(e => { const c = (e.getAttribute('data-check') === 'text' ? (e.firstElementChild && e.id === 't2' ? e.firstElementChild : e) : e); const r = c.getBoundingClientRect(); return { id: e.id || e.className, kind: e.getAttribute('data-check'), x: r.left, y: r.top, w: r.width, h: r.height, r: r.right, b: r.bottom }; });
      return R;
    } };
})();
</script>
</body>
</html>
